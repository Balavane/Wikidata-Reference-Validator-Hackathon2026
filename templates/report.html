<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Reference Validation Report</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <style>
    body {
      background-color: #f8f9fa;
    }

    h2 {
      font-weight: 600;
    }

    .card {
      border-radius: 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.08);
    }

    .chart-container {
      position: relative;
      height: 300px;
      width: 100%;
    }

    .accordion-button .ref-url {
      display: inline-block;
      max-width: 250px;   /* truncate long urls */
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: middle;
    }

    .accordion-body a {
      display: inline-block;
      max-width: 250px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      vertical-align: middle;
    }
  </style>
</head>
<body>

<div class="container my-5">
  <!-- Title -->
  <h2 class="mb-4 text-center">📊 Reference Validation Report</h2>

  <!-- Summary badges -->
  <div class="d-flex justify-content-center gap-4 mb-4">
    <span class="badge bg-success p-3 fs-6">
      ✅ Alive: <span id="aliveCount">0</span>
    </span>
    <span class="badge bg-danger p-3 fs-6">
      ❌ Dead: <span id="deadCount">0</span>
    </span>
  </div>

  <!-- Charts -->
  <div class="row mb-4">
    <!-- Pie Chart -->
    <div class="col-md-6 mb-4">
      <div class="card">
        <div class="card-body text-center">
          <h5 class="card-title">Alive vs Dead (Pie)</h5>
          <div class="chart-container">
            <canvas id="refChart"></canvas>
          </div>
        </div>
      </div>
    </div>

    <!-- Bar Chart -->
    <div class="col-md-6 mb-4">
      <div class="card">
        <div class="card-body text-center">
          <h5 class="card-title">Alive vs Dead (Histogram)</h5>
          <div class="chart-container">
            <canvas id="refBarChart"></canvas>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Detailed References -->
  <div class="card mb-4">
    <div class="card-body">
      <h5 class="card-title mb-3">Detailed References</h5>
      <div class="accordion" id="refAccordion"></div>
    </div>
  </div>

  <!-- Actions -->
  <div class="text-center mt-4 d-flex justify-content-center gap-2 flex-wrap">
    <a href="{{ url_for('home') }}" class="btn btn-secondary">🔄 New Validation</a>

    <!-- Format selector + Download button -->
    <div class="input-group" style="width: auto;">
      <select id="downloadFormat" class="form-select">
        <option value="csv">CSV (.csv)</option>
        <option value="excel">Excel (.xlsx)</option>
      </select>
      <button id="downloadBtn" class="btn btn-success">⬇️ Download Results</button>
    </div>
  </div>
</div>

<script>
  const raw = localStorage.getItem("reportData");
  if (raw) {
    const report = JSON.parse(raw);

    // Fill badges
    document.getElementById("aliveCount").textContent = report.aliveCount;
    document.getElementById("deadCount").textContent = report.deadCount;

    // Pie Chart
    new Chart(document.getElementById("refChart"), {
      type: "pie",
      data: {
        labels: ["Alive", "Dead"],
        datasets: [{
          data: [report.aliveCount, report.deadCount],
          backgroundColor: ["#28a745", "#dc3545"]
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false
      }
    });

    // Histogram (Bar Chart)
    new Chart(document.getElementById("refBarChart"), {
      type: "bar",
      data: {
        labels: ["Alive", "Dead"],
        datasets: [{
          label: "References",
          data: [report.aliveCount, report.deadCount],
          backgroundColor: ["#28a745", "#dc3545"]
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
      }
    });

    // Accordion for references
    const accordion = document.getElementById("refAccordion");
    report.references.forEach((ref, i) => {
      const item = document.createElement("div");
      item.className = "accordion-item";
      item.innerHTML = `
        <h2 class="accordion-header" id="heading${i}">
          <button class="accordion-button collapsed d-flex justify-content-between align-items-center"
            type="button"
            data-bs-toggle="collapse" data-bs-target="#collapse${i}"
            aria-expanded="false" aria-controls="collapse${i}">
            <span class="ref-url" title="${ref.url}">
              ${ref.url}
            </span>
            <span class="ms-2">
              ${ref.status === "alive" ? "✅ Alive" : "❌ Dead"}
            </span>
          </button>
        </h2>
        <div id="collapse${i}" class="accordion-collapse collapse"
          aria-labelledby="heading${i}" data-bs-parent="#refAccordion">
          <div class="accordion-body">
            <p><strong>Property:</strong> ${ref.propertyLabel}</p>
            ${ref.statementValue ? `<p><strong>Value:</strong> ${ref.statementValue}</p>` : ""}
            <p><a href="${ref.url}" target="_blank" title="${ref.url}">${ref.url}</a></p>
            ${
              ref.status === "dead" && ref.suggestedArchive
              ? `<div class="alert alert-info p-3 mt-2">
                   <div class="d-flex justify-content-between align-items-center flex-wrap gap-2">
                     <div class="text-break" style="max-width: 75%;">
                       <strong>🔁 Version archivée suggérée (Wayback Machine) :</strong><br>
                       <a href="${ref.suggestedArchive.archiveUrl}" target="_blank" class="fw-semibold">
                         ${ref.suggestedArchive.archiveUrl}
                       </a>
                     </div>
                     <button class="btn btn-sm btn-primary" onclick="copyReportArchive('${ref.suggestedArchive.archiveUrl}', this)">
                       📋 Copier l'archive
                     </button>
                   </div>
                 </div>`
              : (ref.status === "dead"
                 ? `<div class="alert alert-warning p-2 mt-2">
                      ⚠️ Suggestion: Please review or update this reference.
                    </div>`
                 : "")
            }
          </div>
        </div>
      `;
      accordion.appendChild(item);
    });
  } else {
    // If opened without validation
    document.body.innerHTML = `
      <div class="container my-5 text-center">
        <div class="alert alert-warning">
          ⚠️ No report data found. Please run a validation first.
        </div>
        <a href="{{ url_for('home') }}" class="btn btn-primary">Go Back</a>
      </div>
    `;
  }

  // ── TÉLÉCHARGEMENT CSV / EXCEL ──────────────────────────────
  const downloadBtn = document.getElementById("downloadBtn");
  if (downloadBtn) {
    downloadBtn.onclick = () => {
      const raw = localStorage.getItem("reportData");
      if (!raw) {
        alert("Aucune donnée de rapport disponible. Veuillez d'abord lancer une validation.");
        return;
      }

      const report = JSON.parse(raw);
      const format = document.getElementById("downloadFormat").value;
      const filename = `wikidata-rapport-${report.qid || "export"}-${new Date().toISOString().slice(0,10)}`;

      // ── Lignes de données communes ──
      const headers = ["URL", "Statut", "Propriété", "Valeur", "Archive Wayback"];
      const rows = report.references.map(ref => [
        ref.url || "",
        ref.status === "alive" ? "Valide" : "Mort",
        ref.propertyLabel || "",
        ref.statementValue || "",
        ref.suggestedArchive ? ref.suggestedArchive.archiveUrl : ""
      ]);

      if (format === "csv") {
        // ── Export CSV ──
        const escapeCell = val => {
          const str = String(val);
          // Échapper les guillemets et entourer de guillemets si nécessaire
          return str.includes(",") || str.includes('"') || str.includes("\n")
            ? `"${str.replace(/"/g, '""')}"`
            : str;
        };

        const metaLines = [
          `# Rapport de validation Wikidata`,
          `# Élément : ${report.label} (${report.qid})`,
          `# Date : ${new Date().toLocaleString("fr-FR")}`,
          `# Références valides : ${report.aliveCount} | Mortes : ${report.deadCount} | Durée : ${report.duration}s`,
          ``
        ].join("\n");

        const csvBody = [headers, ...rows]
          .map(row => row.map(escapeCell).join(","))
          .join("\n");

        const csvContent = metaLines + csvBody;
        const blob = new Blob(["\uFEFF" + csvContent], { type: "text/csv;charset=utf-8;" });
        triggerDownload(blob, `${filename}.csv`);

      } else if (format === "excel") {
        // ── Export Excel (.xlsx) via SheetJS ──
        const wb = XLSX.utils.book_new();

        // Feuille 1 : Résumé
        const summaryData = [
          ["Rapport de validation Wikidata"],
          ["Élément", `${report.label} (${report.qid})`],
          ["Date", new Date().toLocaleString("fr-FR")],
          ["Références valides", report.aliveCount],
          ["Références mortes", report.deadCount],
          ["Durée (s)", report.duration]
        ];
        const wsSummary = XLSX.utils.aoa_to_sheet(summaryData);
        XLSX.utils.book_append_sheet(wb, wsSummary, "Résumé");

        // Feuille 2 : Détail des références
        const wsRefs = XLSX.utils.aoa_to_sheet([headers, ...rows]);
        // Largeurs de colonnes automatiques
        wsRefs["!cols"] = [
          { wch: 60 }, { wch: 10 }, { wch: 25 }, { wch: 25 }, { wch: 60 }
        ];
        XLSX.utils.book_append_sheet(wb, wsRefs, "Références");

        XLSX.writeFile(wb, `${filename}.xlsx`);
      }
    };
  }

  /** Déclenche le téléchargement d'un Blob dans le navigateur */
  function triggerDownload(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  /** Copier l'URL archivée depuis la page de rapport */
  function copyReportArchive(url, btn) {
    navigator.clipboard.writeText(url).then(() => {
      const orig = btn.innerHTML;
      btn.innerHTML = "✅ Copié !";
      btn.classList.remove("btn-primary");
      btn.classList.add("btn-success");
      setTimeout(() => {
        btn.innerHTML = orig;
        btn.classList.remove("btn-success");
        btn.classList.add("btn-primary");
      }, 2000);
    }).catch(() => {
      prompt("Copiez l'URL :", url);
    });
  }
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
