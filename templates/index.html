<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Wikidata Reference Validator</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v={{ range(1000,9999) | random }}">
</head>
<body>

  <!-- Navbar -->
 <nav class="navbar navbar-expand-lg glass-navbar shadow-sm fixed-top">


    <div class="container">
      <a class="navbar-brand fw-bold" href="{{ url_for('home') }}">
        <i class="bi bi-search-heart"></i> Wikidata Validator
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
    </div>
    <ul id="suggestions" class="suggestions" role="listbox" aria-label="Matching Wikidata items" hidden></ul>
  </form>

  <div class="hero__examples" aria-label="Example items">
    <button type="button" class="chip" data-example-qid="Q42" data-example-label="Douglas Adams">Douglas Adams</button>
    <button type="button" class="chip" data-example-qid="Q7186" data-example-label="Marie Curie">Marie Curie</button>
    <button type="button" class="chip" data-example-qid="Q8673" data-example-label="Lagos">Lagos</button>
    <button type="button" class="chip" data-example-qid="Q28865" data-example-label="Python">Python</button>
  </div>

  <p class="hero__meta">
    <span>Live link checks</span><span class="sep">·</span>
    <span>Wayback Machine snapshots</span><span class="sep">·</span>
    <span>8 source categories</span>
  </p>
</section>

    <!-- Results -->
    <div id="result"></div>
  </div>
  
  <script src="{{ url_for('static', filename='script.js') }}?v={{ range(1000,9999) | random }}"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
